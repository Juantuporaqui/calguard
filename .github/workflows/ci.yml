name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de dominio
        run: npm test
      - name: Coherencia del precache del service worker
        run: node scripts/check-sw-assets.mjs
